name: Build slackie executables

on:
  release:
    types:
      - created

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build darwin amd64
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/slackie-darwin-amd64 .
          tar -C dist -czf dist/slackie-darwin-amd64.tar.gz slackie-darwin-amd64

      - name: Build darwin arm64
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/slackie-darwin-arm64 .
          tar -C dist -czf dist/slackie-darwin-arm64.tar.gz slackie-darwin-arm64

      - name: Build linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/slackie-linux-amd64 .
          tar -C dist -czf dist/slackie-linux-amd64.tar.gz slackie-linux-amd64

      - name: Build linux arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/slackie-linux-arm64 .
          tar -C dist -czf dist/slackie-linux-arm64.tar.gz slackie-linux-arm64

      - name: Build windows amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/slackie-windows-amd64.exe .
          cd dist
          zip slackie-windows-amd64.zip slackie-windows-amd64.exe

      - name: Build windows arm64
        env:
          GOOS: windows
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/slackie-windows-arm64.exe .
          cd dist
          zip slackie-windows-arm64.zip slackie-windows-arm64.exe

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/slackie-darwin-amd64.tar.gz
            dist/slackie-darwin-arm64.tar.gz
            dist/slackie-linux-amd64.tar.gz
            dist/slackie-linux-arm64.tar.gz
            dist/slackie-windows-amd64.zip
            dist/slackie-windows-arm64.zip
