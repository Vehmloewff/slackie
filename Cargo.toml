[package]
name = "slackie"
version = "0.1.0"
edition = "2021"

[lib]
name = "slackie"
path = "lib.rs"

[[bin]]
name = "slackie"
path = "main.rs"

[[bin]]
name = "slackied"
path = "bin/slackied.rs"

[dependencies]
env_logger = "0.11"
log = "0.4"
error-stack = "0.5"
thiserror = "2"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
turso = "0.8"
url = "2"
